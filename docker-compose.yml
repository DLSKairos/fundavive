services:
  postgres:
    image: postgres:16
    container_name: fundavive_db
    restart: always
    environment:
      POSTGRES_USER: fundavive
      POSTGRES_PASSWORD: fundavive123
      POSTGRES_DB: fundavive_db
    ports:
      # 5433 en el host (no 5432): en esta máquina ya hay un Postgres.app nativo
      # ocupando el 5432, y las conexiones desde el host (p. ej. `prisma migrate`
      # corrido fuera de Docker) terminaban hablando con esa instancia en vez de
      # con este contenedor. La comunicación interna entre servicios del compose
      # (backend -> postgres:5432) no se ve afectada, solo el acceso desde el host.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: fundavive_backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      # DATABASE_URL se sobreescribe explícitamente: dentro de la red de Docker el host
      # de Postgres es el nombre del servicio ("postgres"), no "localhost" como en .env
      # (que está pensado para correr Prisma/Nest fuera de Docker). Docker Compose da
      # precedencia a `environment` sobre `env_file`, así que este valor gana.
      DATABASE_URL: "postgresql://fundavive:fundavive123@postgres:5432/fundavive_db?schema=public"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: fundavive_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
